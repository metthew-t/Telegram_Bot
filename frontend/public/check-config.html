<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Config Check</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }
        .info {
            background: #000;
            padding: 20px;
            border: 2px solid #0f0;
            margin: 10px 0;
        }
        .good { color: #0f0; }
        .bad { color: #f00; }
    </style>
</head>
<body>
    <h1>Frontend Configuration Check</h1>
    <div class="info">
        <h2>Deployment Info</h2>
        <p><strong>Build Time:</strong> <span id="buildTime">2024-12-27 Latest</span></p>
        <p><strong>Expected Backend:</strong> <span class="good">https://telegram-bot-backend-bwu4.onrender.com</span></p>
        <p><strong>Old Wrong URL:</strong> <span class="bad">https://telegram-bot-tazz.onrender.com</span></p>
    </div>
    
    <div class="info">
        <h2>Test Backend Connection</h2>
        <button onclick="testBackend()">Test Connection</button>
        <pre id="result"></pre>
    </div>

    <script>
        async function testBackend() {
            const result = document.getElementById('result');
            result.textContent = 'Testing...';
            
            try {
                const response = await fetch('https://telegram-bot-backend-bwu4.onrender.com/api/diagnostic/');
                const data = await response.json();
                result.className = 'good';
                result.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                result.className = 'bad';
                result.textContent = 'Error: ' + error.message;
            }
        }

        // Auto-test on load
        window.addEventListener('load', () => {
            setTimeout(testBackend, 500);
        });
    </script>
</body>
</html>
